name: measure

services:
  postgres:
    image: postgres:16-alpine
    container_name: measure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: measure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d measure"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - measure_pg_data:/var/lib/postgresql/data

volumes:
  measure_pg_data:
