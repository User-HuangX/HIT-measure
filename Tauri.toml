productName = "HIT-measure"  # 应用显示名称
version = "0.0.1"               # 应用版本号
identifier = "com.tableandtable.app"  # 应用唯一标识符（macOS bundle ID / Android package name）

[build]
# 与 `.env` 的 `DEV_SERVER_PORT` 一致；改端口请同步此处或只用 `npm run tauri:dev`
devUrl = "http://localhost:5180"
beforeDevCommand = "npm run dev"  # 开发模式前执行的命令（启动 Vite）
frontendDist = "./dist"   # 前端构建输出目录
beforeBuildCommand = "npm run build"  # 生产构建前执行的命令


[bundle]
active = true      # 启用打包功能
# 本地交叉编译时只用 nsis；CI 可按平台覆盖此值
targets = ["nsis"]

[bundle.windows.nsis]
installerIcon = "icons/icon.ico"

# 安装器自动下载并安装 WebView2 Runtime
[bundle.windows.webviewInstallMode]
type = "downloadBootstrapper"

# MJPEG 预览走 Asset；开发保留 Vite ws
[app.security]
assetProtocol = { enable = true, scope = ["**"] }
devCsp = "default-src 'self'; connect-src ipc: http://ipc.localhost http://localhost:* ws://localhost:* ws://127.0.0.1:*; img-src 'self' asset: http://asset.localhost blob: data:; media-src 'self' asset: http://asset.localhost blob: data:;"
csp = "default-src 'self'; connect-src ipc: http://ipc.localhost; img-src 'self' asset: http://asset.localhost blob: data:; media-src 'self' asset: http://asset.localhost blob: data:;"

[[app.windows]]
title = "HIT-measure"
width = 1600
height = 900
minWidth = 1400
minHeight = 700
resizable = true
fullscreen = false
decorations = false
transparent = true
